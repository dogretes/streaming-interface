<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix</title>

    <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Áudio de abertura -->
    <audio
        src="audio/tudum-netflix-sound.mp3"
        class="audio">
    </audio>


    <!-- MENU SUPERIOR -->

    <ul>

        
    </ul>


    <!-- VÍDEO PRINCIPAL -->

    <video
        src="video/stranger-things.mp4"
        autoplay
        muted
        loop
        class="video">
    </video>


    <!-- BOTÃO DO SOM -->

    <button class="botao-som">
        🔇
    </button>


    <!-- INFORMAÇÕES DO FILME -->

    <div class="capa">

        <h1 class="capa-titulo">
            Stranger Things
        </h1>

        <p class="capa-descricao">
            Uma série de ficção científica ambientada na pequena cidade de Hawkins.
        </p>

        <button class="link-assistir">
            Assistir
        </button>

        <button class="link-info">
            Mais Informações
        </button>

    </div>


    <!-- CATÁLOGO -->

    <div class="catalogo">

        <h2 class="titulo-carrousel">
            Principais Filmes e Séries
        </h2>


        <div class="catalogo-container">

            <button class="controle anterior">
                ‹
            </button>


            <div
                class="lista-filmes"
                id="lista-filmes">
            </div>


            <button class="controle proximo">
                ›
            </button>

        </div>

    </div>


    <!-- MODAL -->

    <div class="modal">

        <div class="modal-conteudo">
            
            <button class="fechar-modal">×</button>

            <h2 class="modal-titulo"></h2>

            <p class="modal-descricao"></p>

            <p>
                Gênero:
                <strong class="modal-genero"></strong>
            </p>

            <p>
                Ano de lançamento:
                <strong class="modal-ano"></strong>
            </p>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
